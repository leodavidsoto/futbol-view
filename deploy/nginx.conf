# Sirve el cliente compilado y hace de proxy hacia la API.
#
# Con esto, cliente y API comparten origen: CORS deja de hacer falta y
# `CORS_ALLOW_ORIGINS` puede cerrarse en producción sin romper nada.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite compila una SPA: cualquier ruta desconocida devuelve el index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Subidas de vídeo de hasta 1 GB (MAX_UPLOAD_MB del backend). Sin esto,
        # nginx corta la petición con un 413 propio antes de que la API la vea,
        # y el mensaje de error no dice de dónde viene.
        client_max_body_size 1024m;

        # El análisis es NDJSON en streaming: si nginx lo almacena, el cliente
        # no recibe nada hasta el final y la barra de progreso no se mueve.
        proxy_buffering off;
        # Un partido largo tarda; sin esto, nginx corta a los 60 s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
